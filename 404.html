<!doctype html>
<html lang="en">
  <html lang="en" class="dark">
  <head>
 <meta http-equiv="refresh" content="0; url=./index.html" />
 <script>
    // Github Pages SPA Refresh Fix
    // Redirect any 404 route back to index.html 
    (function() {
      var redirecTo =window.location.protocol + "//" + window.location.host + window.location.pathname.replace(/404\.html$/, "index.html");
      if (window.location.pathname !== "/404.html" && window.location.pathname !== "/index.html") {
        window.location.replace(redirecTo);
      }
    
    
    })();
 </script>
   
   </head>

  <body>
    <div id="root"></div>

  </body>
</html>
